<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 96" width="680" height="96" fill="none">
  <defs>
    <linearGradient id="glow-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Glowing Card Background -->
  <rect width="680" height="96" rx="12" fill="#0a0e17"/>
  <rect x="0.5" y="0.5" width="679" height="95" rx="11.5" stroke="url(#glow-border)" stroke-width="1.2"/>

  <!-- Centered Sparkle & Tag -->
  <text x="340" y="27" fill="#38bdf8" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" letter-spacing="3" text-anchor="middle">
    ✦ PHILOSOPHY ✦
  </text>

  <!-- Centered Chinese Motto -->
  <text x="340" y="54" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="500" letter-spacing="1.5" text-anchor="middle">
    保持好奇，持续构建，把想法变成现实。
  </text>

  <!-- Centered English Motto -->
  <text x="340" y="78" fill="#94a3b8" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="1" text-anchor="middle">
    Stay curious, keep shipping, and build things that matter.
  </text>
</svg>
