<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 72" width="680" height="72" fill="none">
  <defs>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <g text-anchor="middle">
    <!-- Chinese with delicate glow -->
    <text x="340" y="28" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" font-weight="600" letter-spacing="2">
      保持好奇 · 持续构建 · 把想法变成现实
    </text>

    <!-- English with monospace and trailing cursor block -->
    <text x="340" y="54" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="1.5">
      <tspan fill="#64748b">/* </tspan>
      <tspan fill="#94a3b8">Stay curious, keep shipping, and build things that matter</tspan>
      <tspan fill="#64748b"> */</tspan>
      <tspan fill="#38bdf8"> ▍</tspan>
    </text>
  </g>
</svg>
