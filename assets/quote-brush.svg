<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 84" width="680" height="84" fill="none">
  <defs>
    <linearGradient id="sig-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- English Cursive Script Signature Line -->
  <text x="340" y="38" fill="url(#sig-glow)" font-family="'Brush Script MT', 'Segoe Script', 'Snell Roundhand', 'Caveat', cursive" font-size="34" font-style="italic" text-anchor="middle">
    Stay curious, keep shipping.
  </text>

  <!-- Chinese Subtext with code comment style -->
  <text x="340" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="400" letter-spacing="1.5" text-anchor="middle">
    // 保持好奇，持续构建，把想法变成现实。
  </text>
</svg>
