<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 114" width="680" height="114" fill="none">
  <!-- Window Background -->
  <rect width="680" height="114" rx="10" fill="#0a0e17" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Window Header / Titlebar -->
  <rect width="680" height="30" rx="10" fill="#0f172a"/>
  <!-- Hide bottom border radius for header -->
  <rect y="20" width="680" height="10" fill="#0f172a"/>
  <line x1="0" y1="30" x2="680" y2="30" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Traffic Light Dots -->
  <circle cx="20" cy="15" r="5" fill="#ef4444"/>
  <circle cx="36" cy="15" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="15" r="5" fill="#10b981"/>
  
  <!-- Window Title -->
  <text x="340" y="19" fill="#64748b" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" text-anchor="middle">power@runtime ~ motto</text>
  
  <!-- Terminal Content -->
  <!-- Prompt line -->
  <text x="22" y="52" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12">
    <tspan fill="#38bdf8">❯</tspan>
    <tspan fill="#94a3b8"> cat</tspan>
    <tspan fill="#e2e8f0"> ~/.motto</tspan>
  </text>
  
  <!-- Output lines -->
  <text x="22" y="77" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" font-weight="500" letter-spacing="1">
    “保持好奇，持续构建，把想法变成现实。”
  </text>
  
  <text x="22" y="98" fill="#38bdf8" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12" opacity="0.9">
    Stay curious, keep shipping, and build things that matter.
  </text>
</svg>
