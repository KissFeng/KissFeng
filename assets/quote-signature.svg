<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 76" width="680" height="76" fill="none">
  <defs>
    <linearGradient id="neon-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Main Chinese Quote with Gradient -->
  <text x="340" y="32" fill="url(#neon-cyan-purple)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="600" letter-spacing="2" text-anchor="middle">
    “ 保持好奇，持续构建，把想法变成现实 ”
  </text>

  <!-- English Subtext in Hacker Monospace Style with // -->
  <text x="340" y="56" fill="#64748b" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" letter-spacing="2.5" text-anchor="middle">
    // STAY CURIOUS, KEEP SHIPPING &amp; BUILD THINGS THAT MATTER
  </text>

  <!-- Glowing Underline Accent with subtle taper -->
  <path d="M 200 68 Q 340 73 480 68" stroke="url(#neon-cyan-purple)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
