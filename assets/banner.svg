<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="40" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Radial ambient glows -->
    <radialGradient id="radial-cyan" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </radialGradient>
    <radialGradient id="radial-purple" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.3" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(400px); }
    }
    .pulse-node { animation: pulse 3s infinite ease-in-out; }
    .mono-font { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="340" rx="16" fill="url(#cyber-grid)" />
  <rect width="1200" height="340" rx="16" fill="url(#radial-cyan)" />
  <rect width="1200" height="340" rx="16" fill="url(#radial-purple)" />

  <!-- Outer Glowing Border -->
  <rect x="1.5" y="1.5" width="1197" height="337" rx="15" fill="none" stroke="url(#border-glow)" stroke-width="1.5" />

  <!-- Decorative Circuit lines & Nodes -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" fill="none">
    <path d="M 60 80 L 140 80 L 180 120 L 260 120" />
    <path d="M 1000 60 L 1080 60 L 1120 100 L 1150 100" />
    <path d="M 950 260 L 1020 260 L 1060 220 L 1140 220" />
    <path d="M 80 270 L 150 270 L 190 230 L 240 230" />
  </g>
  <g fill="#38bdf8">
    <circle cx="60" cy="80" r="3" class="pulse-node" />
    <circle cx="260" cy="120" r="3" class="pulse-node" />
    <circle cx="1000" cy="60" r="3" class="pulse-node" />
    <circle cx="1140" cy="220" r="3" class="pulse-node" />
    <circle cx="80" cy="270" r="3" class="pulse-node" />
  </g>

  <!-- Left Header Status Pill -->
  <g transform="translate(80, 50)">
    <rect width="320" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <circle cx="18" cy="16" r="9" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" class="pulse-node" />
    <text x="36" y="21" fill="#94a3b8" font-size="12" font-weight="600" class="mono-font" letter-spacing="1">AI AGENT ARCHITECT &amp; EXPLORER</text>
  </g>

  <!-- Right National Honor Pill -->
  <g transform="translate(830, 50)">
    <rect width="290" height="32" rx="16" fill="#0f172a" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.5" />
    <text x="18" y="21" fill="#fbbf24" font-size="13">🏆</text>
    <text x="40" y="21" fill="#fde68a" font-size="12" font-weight="600" class="mono-font">NATIONAL SCHOLARSHIP AWARDEE</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(80, 150)">
    <text x="0" y="0" fill="url(#primary-glow)" font-size="62" font-weight="900" class="sans-font" letter-spacing="-1">
      KissFeng
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(80, 195)">
    <text x="0" y="0" fill="#cbd5e1" font-size="20" font-weight="400" class="sans-font">
      Bridging LLM Reasoning with Deterministic Engineering
    </text>
  </g>
  <g transform="translate(80, 226)">
    <text x="0" y="0" fill="#94a3b8" font-size="14" font-weight="400" class="mono-font">
      专注于 LangGraph 显式状态机 · MCP 开放协议 · 混合检索 RAG · 全栈智能体系统闭环
    </text>
  </g>

  <!-- Tech Tags Floating at Bottom -->
  <g transform="translate(80, 272)">
    <!-- Tag 1: LangGraph -->
    <g transform="translate(0, 0)">
      <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="18" fill="#38bdf8" font-size="12" font-weight="600" class="mono-font" text-anchor="middle">⚙️ LangGraph</text>
    </g>
    <!-- Tag 2: MCP Protocol -->
    <g transform="translate(142, 0)">
      <rect width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="72" y="18" fill="#818cf8" font-size="12" font-weight="600" class="mono-font" text-anchor="middle">🔌 MCP Protocol</text>
    </g>
    <!-- Tag 3: Hybrid RAG -->
    <g transform="translate(299, 0)">
      <rect width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="72" y="18" fill="#c084fc" font-size="12" font-weight="600" class="mono-font" text-anchor="middle">🔍 Hybrid RAG</text>
    </g>
    <!-- Tag 4: Full-Stack闭环 -->
    <g transform="translate(456, 0)">
      <rect width="165" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="82" y="18" fill="#34d399" font-size="12" font-weight="600" class="mono-font" text-anchor="middle">🚀 Full-Stack Close</text>
    </g>
    <!-- Tag 5: Digital Garden -->
    <g transform="translate(633, 0)">
      <rect width="170" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="85" y="18" fill="#f472b6" font-size="12" font-weight="600" class="mono-font" text-anchor="middle">📖 notes.power8.top</text>
    </g>
  </g>
</svg>