<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate & Carbon -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="60%" stop-color="#0d1320" />
      <stop offset="100%" stop-color="#06090f" />
    </linearGradient>

    <!-- Metallic Titanium Accent Glow -->
    <linearGradient id="text-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Minimal Border -->
    <linearGradient id="border-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Architecture Dot Matrix Pattern -->
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#38bdf8" fill-opacity="0.12" />
    </pattern>

    <!-- Radial Soft Ambiance -->
    <radialGradient id="center-glow" cx="15%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
    .pulse-dot { animation: pulse 2.5s infinite ease-in-out; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="280" rx="12" fill="url(#bg-grad)" />
  <rect width="1200" height="280" rx="12" fill="url(#dot-grid)" />
  <rect width="1200" height="280" rx="12" fill="url(#center-glow)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="278" rx="11" fill="none" stroke="url(#border-line)" stroke-width="1" />

  <!-- Engineering Architectural Markers (Crosshairs) -->
  <g stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" fill="none">
    <line x1="40" y1="36" x2="52" y2="36" />
    <line x1="46" y1="30" x2="46" y2="42" />
    
    <line x1="1148" y1="36" x2="1160" y2="36" />
    <line x1="1154" y1="30" x2="1154" y2="42" />

    <line x1="40" y1="244" x2="52" y2="244" />
    <line x1="46" y1="238" x2="46" y2="250" />

    <line x1="1148" y1="244" x2="1160" y2="244" />
    <line x1="1154" y1="238" x2="1154" y2="250" />
  </g>

  <!-- Top Status Indicator -->
  <g transform="translate(80, 48)">
    <circle cx="0" cy="0" r="4" fill="#10b981" />
    <circle cx="0" cy="0" r="8" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" class="pulse-dot" />
    <text x="16" y="4" fill="#64748b" font-size="11" font-weight="600" class="mono" letter-spacing="2">SYSTEM STATUS: BUILDING &amp; SHIPPING</text>
  </g>

  <!-- Right Meta Coordinate Tag -->
  <g transform="translate(1120, 48)" text-anchor="end">
    <text x="0" y="4" fill="#475569" font-size="11" class="mono" letter-spacing="1.5">39°54'N · 116°23'E // ARCHITECTURE</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" fill="url(#text-glow)" font-size="54" font-weight="800" class="sans" letter-spacing="-1">
      KissFeng
    </text>
    <text x="260" y="-12" fill="#38bdf8" font-size="12" font-weight="700" class="mono" letter-spacing="1.5">
      [ SYSTEMS &amp; AGENT RUNTIME ]
    </text>
  </g>

  <!-- High-Level Creed / Architectural Premise -->
  <g transform="translate(80, 172)">
    <text x="0" y="0" fill="#94a3b8" font-size="18" font-weight="400" class="sans">
      Designing deterministic execution runtimes for probabilistic intelligence.
    </text>
  </g>

  <!-- Focus Coordinates (Clean Monospace Separator) -->
  <g transform="translate(80, 222)">
    <!-- Node 1 -->
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="600" class="mono">01 // </text>
    <text x="42" y="0" fill="#cbd5e1" font-size="12" font-weight="500" class="sans">Explicit State Machines (LangGraph)</text>

    <!-- Node 2 -->
    <text x="340" y="0" fill="#38bdf8" font-size="12" font-weight="600" class="mono">02 // </text>
    <text x="382" y="0" fill="#cbd5e1" font-size="12" font-weight="500" class="sans">Model Context Protocol (MCP)</text>

    <!-- Node 3 -->
    <text x="660" y="0" fill="#38bdf8" font-size="12" font-weight="600" class="mono">03 // </text>
    <text x="702" y="0" fill="#cbd5e1" font-size="12" font-weight="500" class="sans">High-Throughput Production Gateways</text>
  </g>
</svg>